# ============================================================
# 轻语博客 · GitHub Actions 自动部署到 Cloudflare Workers
# ------------------------------------------------------------
# 部署目标：Cloudflare Workers（域名 kejiland.azhz.workers.dev
#   → 默认 worker 名 kejiland；Secrets 设置 PAGES_PROJECT_NAME 可覆盖）
# 敏感数据全部存放在 GitHub Secrets，部署时注入：
#   · PAGES_PROJECT_NAME  （可选）自定义 worker 名；不设置 = 用 wrangler.workers.toml 的 name
#   · BLOG_KV_ID          → 部署前替换进 wrangler.workers.toml 的 [[kv_namespaces]] id
#                          （wrangler 对 kv id 不支持 {env.} 内插，用 python3 显式替换）
#   · BLOG_ADMIN_SETUP_KEY→ 必填！首次设置管理员密码的安装密钥（后端 fail-closed：
#                          未配置时 /api/admin/setup 与 login 均拒绝初始化，杜绝抢注竞态）
#   · BLOG_WRITE_TOKEN    →（可选）旧式写入令牌
#   · CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID → wrangler 部署凭证
#   · SITE_URL  （可选，强烈建议）站点对外域名 https://你的域名，用于收紧 CORS 为仅允许本站
#   · CF_ZONE_ID（可选）自定义域名的 Zone ID，配合 CF_API_TOKEN 实现「发布即清边缘缓存」
#       （两者均缺失时自动降级为空，不影响部署；SITE_URL 缺失时 CORS 回退为回显来源）
# 触发：push 到 main / 手动运行。
# ============================================================
name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 一次性全局安装 wrangler（CI 镜像层缓存 → 首次快，之后直接用 wrangler 命令）
      # 避免下方 migrations 循环与 secret 写入里每次 npx --yes 重复解析/网络检查
      - name: Setup wrangler CLI
        run: npm install -g wrangler@3.90.0

      # 部署前跑本地测试（纯 Node 模拟环境，无网络/无凭据依赖；失败即中止，不部署）
      - name: Run tests (smoke + verify)
        run: |
          node smoke-test.js
          node gb-verify.js
          node search-verify.js

      - name: Check required secrets
        env:
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
          BLOG_D1_ID: ${{ secrets.BLOG_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOG_ADMIN_SETUP_KEY: ${{ secrets.BLOG_ADMIN_SETUP_KEY }}
        run: |
          MISSING=""
          # BLOG_ADMIN_SETUP_KEY 必填：后端 /api/admin/setup 为 fail-closed，
          # 未配置该密钥时无法初始化管理员（安全默认，杜绝抢注竞态）
          for v in BLOG_KV_ID BLOG_D1_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BLOG_ADMIN_SETUP_KEY; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少必要的 GitHub Secrets:$MISSING"
            echo "请到 仓库 Settings → Secrets and variables → Actions 添加后重试。"
            echo "（BLOG_ADMIN_SETUP_KEY：首次设置管理员密码的安装密钥，后端未配置时将拒绝初始化）"
            exit 1
          fi
          echo "✅ 必要 Secrets 齐全（值不会打印）"

      # 诊断：验证凭证账户，便于定位 8000007 类错误（仅手动触发时运行，日常 push 跳过节省时间）
      - name: Diagnose account & worker
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 账户 $CLOUDFLARE_ACCOUNT_ID ==="
          wrangler whoami 2>&1 | head -20 || true

      # 生成带真实 KV id 的部署配置（wrangler 对 kv 的 id 不支持 {env.} 内插，
      # 必须显式替换占位符；文件放在仓库根目录，保证 worker.js/public 的相对路径正确）
      - name: Prepare deploy config with real KV id
        env:
          BLOG_KV_ID: ${{ secrets.BLOG_KV_ID }}
          BLOG_D1_ID: ${{ secrets.BLOG_D1_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          python3 - <<'PY'
          import os
          kv_id = os.environ['BLOG_KV_ID'].strip()
          if not kv_id or len(kv_id) != 32 or not all(c in '0123456789abcdef' for c in kv_id.lower()):
              print('::error::BLOG_KV_ID 不是有效的 32 位十六进制 KV id（去除多余空格/换行后重试）')
              raise SystemExit(1)
          src = open('wrangler.workers.toml', encoding='utf-8').read()
          dst = src.replace('{env.BLOG_KV_ID}', kv_id)
          # D1 database_id 是 UUID（如 0fa366ac-f04a-4be2-8e11-5adc6ee6d686），与 KV 的 32 位十六进制不同
          import re
          d1_raw = os.environ['BLOG_D1_ID'].strip().strip('"').strip("'")
          if not re.fullmatch(r'[0-9a-fA-F]{32}', d1_raw.replace('-', '')):
              print('::error::BLOG_D1_ID 不是有效的 D1 database_id（UUID 格式，见 D1 数据库详情页；不是数据库名，也不是 KV 的 ID）')
              raise SystemExit(1)
          dst = dst.replace('{env.BLOG_D1_ID}', d1_raw)
          # 非敏感变量：缺失则替换为空字符串（安全降级，不会留下字面量占位符）
          dst = dst.replace('{env.SITE_URL}', os.environ.get('SITE_URL', '').strip())
          dst = dst.replace('{env.CF_ZONE_ID}', os.environ.get('CF_ZONE_ID', '').strip())
          open('wrangler.workers.ci.toml', 'w', encoding='utf-8').write(dst)
          print('✅ 部署配置已生成（含真实 KV id 与 D1 id，不会打印）')
          PY

      # 部署前应用 D1 表结构（migrations/*.sql，按文件名升序执行）。
      # 记账表 schema_migrations：记录「已成功执行的迁移」，之前跑过的直接跳过，
      # 避免旧的 check_col 字符串匹配无法覆盖表结构语义变化（如 0012 删数据、recreate）。
      # 老库兼容：若某个 ALTER 迁移报 duplicate column，说明列早已存在，按「已应用」记账跳过。
      - name: Apply D1 schema (migrations/*.sql with schema_migrations ledger)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOG_D1_ID: ${{ secrets.BLOG_D1_ID }}
        run: |
          # 建记账表（幂等），并列出已应用的迁移名
          wrangler d1 execute blog --remote --config wrangler.workers.ci.toml \
            --command "CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY, applied_at TEXT DEFAULT (datetime('now')))" >/dev/null 2>&1
          applied=$(wrangler d1 execute blog --remote --config wrangler.workers.ci.toml \
            --command "SELECT name FROM schema_migrations" --json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(r['name'] for r in (d[0]['results'] if d and d[0].get('results') else [])))" 2>/dev/null || true)
          for f in migrations/*.sql; do
            base=$(basename "$f")
            echo "Applying $f"
            # 已在记账表 → 跳过
            if printf '%s\n' "$applied" | grep -qx "$base"; then
              echo "→ 已在 schema_migrations，跳过"
              continue
            fi
            out=$(wrangler d1 execute blog --remote --config wrangler.workers.ci.toml --file="$f" 2>&1)
            code=$?
            if [ $code -ne 0 ]; then
              # 老库兜底：ALTER TABLE ADD COLUMN 在列已存在时报 duplicate column，
              # 说明该迁移在老部署中已实际执行过，按「已应用」记账后跳过；
              # 其余错误一律中断，避免半套 schema 上线
              if echo "$out" | grep -qi "duplicate column"; then
                echo "→ 列已存在（duplicate column），按已应用记账并跳过"
              else
                echo "$out"
                exit 1
              fi
            fi
            # 记账：成功或 duplicate-column 兜底都写入 schema_migrations
            wrangler d1 execute blog --remote --config wrangler.workers.ci.toml \
              --command "INSERT OR IGNORE INTO schema_migrations (name) VALUES ('$base')" >/dev/null 2>&1
          done
          # 以记账表为准拉取一次完整清单（下一轮 CI 生效；本轮不改代码路径）
          echo "✅ D1 schema 应用完成（已记账迁移：$(printf '%s\n' "$applied" | wc -l)）"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --config wrangler.workers.ci.toml
            ${{ secrets.PAGES_PROJECT_NAME != '' && format('--name {0}', secrets.PAGES_PROJECT_NAME) || '' }}

      # 部署后写入运行时 secret（独立 step：secret 经 env 传入，shell 内用 $VAR 引用，
      # 不直接把 secret 值拼进脚本，避免值里含换行/特殊字符时破坏语法）
      - name: Write runtime secrets to Worker
        env:
          BLOG_ADMIN_SETUP_KEY: ${{ secrets.BLOG_ADMIN_SETUP_KEY }}
          BLOG_WRITE_TOKEN: ${{ secrets.BLOG_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_MEDIA_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
          R2_MEDIA_PUBLIC_BASE: ${{ secrets.R2_MEDIA_PUBLIC_BASE }}
          NAME_ARG: ${{ secrets.PAGES_PROJECT_NAME != '' && format('--name {0}', secrets.PAGES_PROJECT_NAME) || '' }}
        run: |
          if [ -n "$BLOG_ADMIN_SETUP_KEY" ]; then
            echo "$BLOG_ADMIN_SETUP_KEY" | wrangler secret put BLOG_ADMIN_SETUP_KEY --config wrangler.workers.ci.toml $NAME_ARG
          fi
          if [ -n "$BLOG_WRITE_TOKEN" ]; then
            echo "$BLOG_WRITE_TOKEN" | wrangler secret put BLOG_WRITE_TOKEN --config wrangler.workers.ci.toml $NAME_ARG
          fi
          # CF_API_TOKEN 同时作为「发布即清缓存」的运行时凭证（purgeTags 需要 Zone·Cache Purge 权限）
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "$CLOUDFLARE_API_TOKEN" | wrangler secret put CF_API_TOKEN --config wrangler.workers.ci.toml $NAME_ARG
          fi
          # R2（音乐直传）：配置了才写入；R2 未配置时音乐上传接口自动降级为 503，不影响其余功能
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ENDPOINT" ] && [ -n "$R2_BUCKET" ]; then
            echo "$R2_ACCESS_KEY_ID"     | wrangler secret put R2_ACCESS_KEY_ID     --config wrangler.workers.ci.toml $NAME_ARG
            echo "$R2_SECRET_ACCESS_KEY" | wrangler secret put R2_SECRET_ACCESS_KEY --config wrangler.workers.ci.toml $NAME_ARG
            echo "$R2_ENDPOINT"          | wrangler secret put R2_ENDPOINT          --config wrangler.workers.ci.toml $NAME_ARG
            echo "$R2_BUCKET"            | wrangler secret put R2_BUCKET            --config wrangler.workers.ci.toml $NAME_ARG
          fi
          # R2 公开读取域名（音频播放地址基址）；有货才写
          if [ -n "$R2_PUBLIC_BASE" ]; then
            echo "$R2_PUBLIC_BASE" | wrangler secret put R2_PUBLIC_BASE --config wrangler.workers.ci.toml $NAME_ARG
          fi
          # R2 媒体桶（图片直传，独立于音乐桶）：凭据与音乐共用，桶名/公开域名独立；
          # 未配置时媒体上传接口自动降级为 503，不影响其余功能
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ENDPOINT" ] && [ -n "$R2_MEDIA_BUCKET" ]; then
            echo "$R2_MEDIA_BUCKET" | wrangler secret put R2_MEDIA_BUCKET --config wrangler.workers.ci.toml $NAME_ARG
          fi
          if [ -n "$R2_MEDIA_PUBLIC_BASE" ]; then
            echo "$R2_MEDIA_PUBLIC_BASE" | wrangler secret put R2_MEDIA_PUBLIC_BASE --config wrangler.workers.ci.toml $NAME_ARG
          fi
          rm -f wrangler.workers.ci.toml
